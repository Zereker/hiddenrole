name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race ./...

      # Coverage over the kernel plus the three rules packages under example/,
      # and nothing else. Left out: enginetest (a harness driven from example/,
      # with no tests of its own and none wanted) and example/ (those are
      # users, not subjects; counting them only dilutes the number).
      - name: Coverage
        run: >
          go test -covermode=atomic -coverprofile=coverage.out
          -coverpkg=github.com/Zereker/hiddenrole,github.com/Zereker/hiddenrole/example/werewolf,github.com/Zereker/hiddenrole/example/missions,github.com/Zereker/hiddenrole/example/onenight
          ./... && go tool cover -func=coverage.out | tail -1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...
